lidar_controller:
  lidar_list:
    type: string_array
    default_value: ["mid360_front/lidar"]
    description: "List of lidar topics, each topic should be in the format of 'device_name/lidar_name'"

  lidar_config:
    __map_lidar_list:
      enable_dynamic_extrinsics:
        type: bool
        default_value: false
        description: "Enable dynamic extrinsics"
      frame_id:
        type: string
        default_value: "livox_frame"
        description: "Frame ID of the lidar"
      enable_imu_integration:
        type: bool
        default_value: false
        description: "Enable IMU integration for pose estimation"
